[project]
name = "visioncore"
version = "0.1.0"
description = "焊接视觉AI训练平台 - 配置驱动的YOLOv8训练框架"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2.0",
    "opencv-python>=4.9.0",
    "pyyaml>=6.0",
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
